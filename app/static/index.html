<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nagarkot Forwarders - Access Control Service</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Fixed Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-header">
        <div class="brand-icon">NF</div>
        <div>
          <div class="brand-title">Nagarkot</div>
          <div class="brand-subtitle">Access Control</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#/queue" class="nav-link active" id="nav-queue">
          <span class="nav-icon">📥</span>
          <span>My Queue</span>
        </a>
        <a href="#/jobs" class="nav-link" id="nav-jobs">
          <span class="nav-icon">📦</span>
          <span>Shipments (Jobs)</span>
        </a>
        <a href="#/approvals" class="nav-link" id="nav-approvals">
          <span class="nav-icon">⏳</span>
          <span>Approvals</span>
        </a>
        <a href="#/access" class="nav-link" id="nav-access">
          <span class="nav-icon">🛡️</span>
          <span>Access Directory</span>
        </a>
        <a href="#/audit" class="nav-link" id="nav-audit">
          <span class="nav-icon">📜</span>
          <span>Audit Trail</span>
        </a>
        <a href="#/explain" class="nav-link" id="nav-explain">
          <span class="nav-icon">🔍</span>
          <span>Explain & Compare</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span>Nagarkot ACS v1.0</span>
        <a href="/docs" target="_blank" style="color: #64748b; text-decoration: none;">API Docs ↗</a>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation menu">☰</button>
          <h1 class="view-heading" id="view-heading">Access Control Service</h1>
        </div>

        <div class="topbar-right">
          <!-- Persona Switcher -->
          <div class="user-switcher-container">
            <span class="user-switcher-label">Acting as:</span>
            <select class="user-switcher-select" id="user-switcher-select" aria-label="Switch acting user persona">
              <option value="">Loading personas...</option>
            </select>
            <span class="user-role-badge" id="user-role-badge">Staff</span>
            <span id="user-absent-indicator" style="display: none;"></span>
          </div>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main class="content-area" id="main-content" role="main" aria-live="polite">
        <!-- Rendered by Router -->
        <div class="skeleton" style="width: 40%; height: 28px; margin-bottom: 20px;"></div>
        <div class="skeleton" style="width: 100%; height: 200px;"></div>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" role="status"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="/ui/js/main.js"></script>
</body>
</html>
